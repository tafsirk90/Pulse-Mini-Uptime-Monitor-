spring.application.name=pulse
server.port=8080

# Data is stored in ./data/pulse.mv.db so it survives restarts
spring.datasource.url=jdbc:h2:file:./data/pulse
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT: change the secret (32+ characters) before deploying anywhere
app.jwt.secret=change-this-secret-to-something-long-and-random-please
app.jwt.expiration-ms=604800000

# Monitoring rules
app.monitor.tick-ms=5000
app.monitor.check-threads=8
app.monitor.failure-threshold=3
app.monitor.max-per-user=20
app.monitor.retention-days=30

# Email alerts
app.mail.enabled=true
app.mail.from=pulse@gmail.com

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_SMTP_USERNAME}
spring.mail.password=${BREVO_SMTP_KEY}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

springdoc.swagger-ui.path=/swagger-ui.html
